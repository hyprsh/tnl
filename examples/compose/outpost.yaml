# An Outpost, on the network of the Services it forwards to. Replace X.Y.Z with
# the exact release, and `apps` with that network. The token comes from
# `docker exec tnl tnl outpost add <name>` on the Edge. It works once; the named
# volume keeps what the Outpost saves, so a restart needs no token.
# The TNL_ROUTE_* lines declare this Outpost's Routes, so no `tnl route add` is
# needed. Remove them to add Routes with the CLI instead.
services:
  tnl-outpost:
    image: ghcr.io/hyprsh/tnl-outpost:X.Y.Z
    container_name: tnl-outpost
    restart: unless-stopped
    environment:
      TNL_TOKEN: paste-the-token-here
      TNL_ROUTE_PHOTOS: "photos.example.com http://immich:2283"
      TNL_ROUTE_MEDIA: "media.example.com http://jellyfin:8096"
    volumes: ["tnl-outpost:/var/lib/tnl-outpost"]
    networks: [apps]
volumes:
  tnl-outpost:
networks:
  apps:
    external: true
