name: ci
# Pushes to main, and pull requests: a push to a PR's branch runs once, as the PR.
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      # All history and tags: the skew check builds the latest v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # gofmt, go vet and staticcheck for both builds, the tests (with the Caddy
      # suite) and the Outpost-only link check. Agents run the same script.
      - run: scripts/check.sh
